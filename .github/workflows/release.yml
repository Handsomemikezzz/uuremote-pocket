name: Release DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release DMG
    runs-on: macos-14

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DMG Package
        run: |
          scripts/build-app.sh --dmg
          ls -la build/PocketMac.dmg

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/PocketMac.dmg
          generate_release_notes: true
