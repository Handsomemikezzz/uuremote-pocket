<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="wfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .wf-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; }
    .wf-sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 12px; fill: #94A3B8; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 13px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 14px; font-weight: 600; fill: #F1F5F9; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 11px; fill: #94A3B8; line-height: 1.45; }
    .code-pill { font-family: "SF Mono", Menlo, monospace; font-size: 10px; fill: #38BDF8; }
  </style>

  <rect width="960" height="360" rx="16" fill="url(#wfBg)" stroke="#334155" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(36, 32)">
    <text class="wf-title">使用工作流 · 极简四步掌控全功能 macOS</text>
    <text class="wf-sub" y="20">不需要任何驱动安装与辅助权限，打开即用，随时优雅撤出</text>
  </g>

  <!-- STEP 1 -->
  <g transform="translate(36, 75)" filter="url(#wfShadow)">
    <rect width="205" height="245" rx="12" fill="url(#stepGrad)" stroke="#38BDF8" stroke-width="1.2" />
    <!-- Step Badge -->
    <rect x="14" y="14" width="28" height="28" rx="14" fill="url(#neonCyan)" />
    <text x="28" y="32" class="step-num">1</text>
    
    <text x="14" y="66" class="step-title">启动 Pocket Mac</text>
    <text x="14" y="90" class="step-desc">常驻菜单栏，原生</text>
    <text x="14" y="106" class="step-desc">iPhone 图标即刻就绪。</text>
    <text x="14" y="122" class="step-desc">仅占用微量内存，</text>
    <text x="14" y="138" class="step-desc">零后台常驻守护进程。</text>

    <!-- Mini Visual -->
    <g transform="translate(14, 160)">
      <rect width="177" height="65" rx="6" fill="#0B132B" stroke="#1E293B" />
      <text x="10" y="22" fill="#64748B" font-size="10" font-family="sans-serif">菜单栏常驻状态：</text>
      <circle cx="22" cy="42" r="8" fill="#0284C7" />
      <text x="36" y="46" fill="#E2E8F0" font-size="11" font-family="sans-serif">Pocket Mac: 就绪</text>
    </g>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(261, 75)" filter="url(#wfShadow)">
    <rect width="205" height="245" rx="12" fill="url(#stepGrad)" stroke="#34D399" stroke-width="1.2" />
    <rect x="14" y="14" width="28" height="28" rx="14" fill="url(#neonGreen)" />
    <text x="28" y="32" class="step-num">2</text>

    <text x="14" y="66" class="step-title">一键进入手机模式</text>
    <text x="14" y="90" class="step-desc">点击菜单预设：</text>
    <text x="14" y="108" class="step-desc">▪ 大字模式 (660×1434)</text>
    <text x="14" y="126" class="step-desc">▪ 标准模式 (800×1738)</text>
    <text x="14" y="144" class="step-desc">瞬时生成专属 HiDPI 屏</text>

    <!-- Mini Visual -->
    <g transform="translate(14, 160)">
      <rect width="177" height="65" rx="6" fill="#06281E" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="24" fill="#6EE7B7" font-size="11" font-family="sans-serif" font-weight="600">✓ 虚拟屏平移至 (0,0)</text>
      <text x="10" y="44" fill="#A7F3D0" font-size="10" font-family="sans-serif">成为 macOS 唯一主屏幕</text>
    </g>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(486, 75)" filter="url(#wfShadow)">
    <rect width="205" height="245" rx="12" fill="url(#stepGrad)" stroke="#C084FC" stroke-width="1.2" />
    <rect x="14" y="14" width="28" height="28" rx="14" fill="url(#neonPurple)" />
    <text x="28" y="32" class="step-num">3</text>

    <text x="14" y="66" class="step-title">手机连入自由操作</text>
    <text x="14" y="90" class="step-desc">iPhone 打开 UU 远程</text>
    <text x="14" y="106" class="step-desc">在显示器中选择虚拟屏：</text>
    <text x="14" y="124" class="step-desc">全屏点对点 19.5:9 满屏，</text>
    <text x="14" y="140" class="step-desc">无黑边、无拉伸、超清！</text>

    <!-- Mini Visual -->
    <g transform="translate(14, 160)">
      <rect width="177" height="65" rx="6" fill="#1B112A" stroke="#9333EA" stroke-width="0.8" />
      <text x="10" y="24" fill="#E9D5FF" font-size="11" font-family="sans-serif" font-weight="600">📱 沉浸式竖屏桌面</text>
      <text x="10" y="44" fill="#C084FC" font-size="10" font-family="sans-serif">全键盘与多点触控支持</text>
    </g>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(711, 75)" filter="url(#wfShadow)">
    <rect width="205" height="245" rx="12" fill="url(#stepGrad)" stroke="#FB923C" stroke-width="1.2" />
    <rect x="14" y="14" width="28" height="28" rx="14" fill="url(#neonOrange)" />
    <text x="28" y="32" class="step-num">4</text>

    <text x="14" y="66" class="step-title">随时一键安全退出</text>
    <text x="14" y="90" class="step-desc">四种撤出通道任选：</text>
    <text x="14" y="106" class="step-desc">❶ 虚拟屏常驻悬浮退出钮</text>
    <text x="14" y="122" class="step-desc">❷ 菜单栏 › 退出手机模式</text>
    <text x="14" y="138" class="step-desc">❸ 快捷键 ⌃⌥⌘9</text>

    <!-- Mini Visual -->
    <g transform="translate(14, 160)">
      <rect width="177" height="65" rx="6" fill="#2E1307" stroke="#EA580C" stroke-width="0.8" />
      <text x="10" y="22" fill="#FDBA74" font-size="10" font-family="sans-serif">二次确认防误触 (3s)</text>
      <text x="10" y="44" fill="#FED7AA" font-size="10" font-family="sans-serif">自动还原原点至物理屏</text>
    </g>
  </g>
</svg>
