<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="macBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="innerPhone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="squircleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS Squircle Body -->
  <rect x="36" y="36" width="440" height="440" rx="98" fill="url(#macBg)" stroke="#334155" stroke-width="2" filter="url(#squircleShadow)" />

  <!-- Mac Mini Outline / Base in Background -->
  <g transform="translate(106, 320)">
    <rect width="300" height="70" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <circle cx="150" cy="35" r="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- White Apple Logo Indicator Glow -->
    <circle cx="282" cy="35" r="2.5" fill="#38BDF8" filter="url(#glow)" />
  </g>

  <!-- Vertical iPhone Centerpiece -->
  <g transform="translate(166, 75)" filter="url(#phoneShadow)">
    <!-- Phone Bezel -->
    <rect width="180" height="340" rx="36" fill="#0A0714" stroke="#64748B" stroke-width="2" />
    <!-- Inner Phone Screen -->
    <rect x="7" y="7" width="166" height="326" rx="30" fill="url(#innerPhone)" stroke="#A855F7" stroke-width="1.5" />
    
    <!-- Dynamic Island -->
    <rect x="62" y="16" width="56" height="12" rx="6" fill="#000000" />
    <circle cx="106" cy="22" r="2.5" fill="#1E293B" />

    <!-- macOS Desktop Interface on Phone Screen -->
    <!-- Mini Menu Bar -->
    <rect x="14" y="34" width="152" height="10" rx="2" fill="#1E293B" />
    <circle cx="22" cy="39" r="2" fill="#EF4444" />
    <circle cx="28" cy="39" r="2" fill="#F59E0B" />
    <circle cx="34" cy="39" r="2" fill="#10B981" />

    <!-- Mac Window 1 (Finder/Editor) -->
    <rect x="14" y="52" width="152" height="110" rx="8" fill="#1E293B" stroke="#00F2FE" stroke-width="1" />
    <rect x="14" y="52" width="152" height="16" rx="8" fill="#0F172A" />
    <!-- Window text/lines -->
    <line x1="24" y1="78" x2="80" y2="78" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="90" x2="110" y2="90" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
    <line x1="24" y1="102" x2="95" y2="102" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
    <line x1="24" y1="114" x2="70" y2="114" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
    <rect x="24" y="126" width="60" height="22" rx="4" fill="url(#neonCyan)" />
    <text x="54" y="141" fill="#0B0F17" font-size="9" font-family="-apple-system, sans-serif" font-weight="bold" text-anchor="middle">Pocket</text>

    <!-- Mac Window 2 (Terminal) -->
    <rect x="14" y="170" width="152" height="96" rx="8" fill="#0A0F1D" stroke="#334155" stroke-width="1" />
    <text x="24" y="190" fill="#34D399" font-size="9" font-family="monospace">$ pocket --phone</text>
    <text x="24" y="206" fill="#94A3B8" font-size="8" font-family="monospace">HiDPI 1320x2868 @2x</text>
    <text x="24" y="222" fill="#38BDF8" font-size="8" font-family="monospace">Primary (0,0) [OK]</text>

    <!-- macOS Dock at Bottom -->
    <rect x="24" y="278" width="132" height="24" rx="8" fill="#334155" fill-opacity="0.6" stroke="#475569" stroke-width="0.8" />
    <circle cx="42" cy="290" r="7" fill="#38BDF8" />
    <circle cx="62" cy="290" r="7" fill="#818CF8" />
    <circle cx="82" cy="290" r="7" fill="#C084FC" />
    <circle cx="102" cy="290" r="7" fill="#F472B6" />
    <circle cx="122" cy="290" r="7" fill="#34D399" />
    <!-- Home indicator bar -->
    <rect x="65" y="318" width="50" height="4" rx="2" fill="#E2E8F0" />
  </g>
</svg>
