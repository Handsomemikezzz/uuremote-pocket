<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B2D" />
    </linearGradient>
    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F293D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1B4E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#181126" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C471ED" />
      <stop offset="100%" stop-color="#F64F59" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#00F2FE" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38EF7D" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#C471ED" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #F8FAFC; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; line-height: 1.5; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    .wire { stroke-dasharray: 4 4; animation: dash 15s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bgGrad)" />
  <rect width="960" height="540" rx="16" fill="none" stroke="#2A374A" stroke-width="1.5" />

  <!-- Top Header -->
  <g transform="translate(40, 42)">
    <text class="title">Pocket Mac 架构与生命周期</text>
    <text class="subtitle" y="24">基于 CGVirtualDisplay 的安全虚拟屏状态机与原点平移拓扑管理</text>
  </g>

  <!-- Status / Pill Badge -->
  <g transform="translate(760, 36)">
    <rect width="160" height="28" rx="14" fill="#0E3A2F" stroke="#10B981" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10B981" filter="url(#neonGlow)" />
    <text x="30" y="18" fill="#A7F3D0" class="badge" text-anchor="start">100% 崩溃安全保证</text>
  </g>

  <!-- SECTION 1: USER TRIGGERS -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="240" height="405" rx="12" fill="url(#primaryCard)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="36" rx="12" fill="#1E293B" />
    <rect x="0" y="24" width="240" height="12" fill="#1E293B" />
    <text x="16" y="23" class="card-title">① 触发交互层 (Triggers)</text>
    
    <!-- Item 1: Status Bar -->
    <g transform="translate(16, 52)">
      <rect width="208" height="66" rx="8" fill="#0F172A" stroke="#2563EB" stroke-width="1" />
      <text x="12" y="22" class="card-title" font-size="12">菜单栏图标 (StatusBar)</text>
      <text x="12" y="40" class="card-body">一键选择大字 / 标准模式</text>
      <text x="12" y="54" class="card-body">实时显示当前状态 (phase)</text>
    </g>

    <!-- Item 2: Floating Button -->
    <g transform="translate(16, 128)">
      <rect width="208" height="66" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1" />
      <text x="12" y="22" class="card-title" font-size="12">悬浮退出按钮 (Panel)</text>
      <text x="12" y="40" class="card-body">虚拟屏右上角常驻，可拖拽</text>
      <text x="12" y="54" class="card-body">点按后 3 秒二次确认防误触</text>
    </g>

    <!-- Item 3: Hotkey -->
    <g transform="translate(16, 204)">
      <rect width="208" height="54" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1" />
      <text x="12" y="22" class="card-title" font-size="12">全局热键 (Carbon Hotkey)</text>
      <text x="12" y="40" class="card-body">⌃ + ⌥ + ⌘ + 9 随时一键撤出</text>
    </g>

    <!-- Item 4: Life Cycle Binding -->
    <g transform="translate(16, 268)">
      <rect width="208" height="118" rx="8" fill="#18132A" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 3" />
      <text x="12" y="22" class="card-title" fill="#C4B5FD" font-size="12">🛡️ 进程生命周期绑定</text>
      <text x="12" y="42" class="card-body" fill="#DDD6FE">Pocket Mac 退出、崩溃</text>
      <text x="12" y="58" class="card-body" fill="#DDD6FE">或被 kill -9 强杀时：</text>
      <text x="12" y="80" class="card-body" fill="#A78BFA">• 虚拟屏由系统内核瞬间销毁</text>
      <text x="12" y="98" class="card-body" fill="#A78BFA">• 主屏 100% 自动归还物理显示器</text>
    </g>
  </g>

  <!-- SECTION 2: CORE ENGINE (VIRTUAL DISPLAY CONTROLLER) -->
  <g transform="translate(320, 95)" filter="url(#cardShadow)">
    <rect width="320" height="405" rx="12" fill="url(#primaryCard)" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="36" rx="12" fill="#0C4A6E" />
    <rect x="0" y="24" width="320" height="12" fill="#0C4A6E" />
    <text x="16" y="23" class="card-title" fill="#BAE6FD">② 核心执行器 (VirtualScreen)</text>

    <!-- State Machine -->
    <g transform="translate(16, 50)">
      <rect width="288" height="96" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1" />
      <text x="12" y="20" class="card-title" font-size="12">收敛型状态机 (Phase Machine)</text>
      
      <!-- State Pills -->
      <g transform="translate(10, 32)">
        <rect width="52" height="24" rx="4" fill="#1E293B" />
        <text x="26" y="16" fill="#94A3B8" class="badge">idle</text>
      </g>
      <path d="M 68 44 L 80 44" stroke="#00F2FE" stroke-width="1.5" marker-end="url(#arrowCyan)" />
      <g transform="translate(86, 32)">
        <rect width="56" height="24" rx="4" fill="#0369A1" />
        <text x="28" y="16" fill="#E0F2FE" class="badge">entering</text>
      </g>
      <path d="M 148 44 L 160 44" stroke="#00F2FE" stroke-width="1.5" marker-end="url(#arrowCyan)" />
      <g transform="translate(166, 32)">
        <rect width="52" height="24" rx="4" fill="#047857" />
        <text x="26" y="16" fill="#D1FAE5" class="badge">active</text>
      </g>
      <path d="M 224 44 L 236 44" stroke="#00F2FE" stroke-width="1.5" marker-end="url(#arrowCyan)" />
      <g transform="translate(242, 32)">
        <rect width="42" height="24" rx="4" fill="#991B1B" />
        <text x="21" y="16" fill="#FEE2E2" class="badge">exit</text>
      </g>

      <text x="12" y="80" class="card-body">快速连击自动收敛，杜绝并发竞态撕裂</text>
    </g>

    <!-- CGVirtualDisplayBridge -->
    <g transform="translate(16, 160)">
      <rect width="288" height="105" rx="8" fill="#082F49" stroke="#38BDF8" stroke-width="1" />
      <text x="12" y="22" class="card-title" fill="#7DD3FC" font-size="12">CGVirtualDisplayBridge (私有桥接)</text>
      <text x="12" y="44" class="card-body" fill="#E0F2FE">• 专有 VendorID (0x504D) 与独占序列号</text>
      <text x="12" y="62" class="card-body" fill="#E0F2FE">• 单一模式创建，严格保护 HiDPI @2x 缩放</text>
      <text x="12" y="80" class="card-body" fill="#E0F2FE">• 最短存活约束 (minLifetime 2.5s) 防崩溃</text>
      <text x="12" y="98" class="card-body" fill="#38EF7D">✓ 绝不触碰物理屏禁用接口，零黑屏隐患</text>
    </g>

    <!-- DisplayConfig (Origin Shifting) -->
    <g transform="translate(16, 278)">
      <rect width="288" height="110" rx="8" fill="#0F172A" stroke="#0EA5E9" stroke-width="1" />
      <text x="12" y="22" class="card-title" font-size="12">DisplayConfig 拓扑原点平移</text>
      <text x="12" y="42" class="card-body">• 事务原子操作 (CGBeginDisplayConfiguration)</text>
      <text x="12" y="60" class="card-body">• 虚拟屏平移至 (0, 0) 成为 macOS 唯一主屏</text>
      <text x="12" y="78" class="card-body">• 物理屏幕安全右移，保持亮屏与辅助工作区</text>
      <text x="12" y="96" class="card-body" fill="#38EF7D">• 退出时原点回滚至历史基准原点</text>
    </g>
  </g>

  <!-- SECTION 3: REMOTE PROTOCOL & IPHONE -->
  <g transform="translate(680, 95)" filter="url(#cardShadow)">
    <rect width="240" height="405" rx="12" fill="url(#phoneCardGrad)" stroke="#A855F7" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="36" rx="12" fill="#4C1D95" />
    <rect x="0" y="24" width="240" height="12" fill="#4C1D95" />
    <text x="16" y="23" class="card-title" fill="#F3E8FF">③ 远端呈现 (Client)</text>

    <!-- UU Remote / Remote Tool -->
    <g transform="translate(16, 52)">
      <rect width="208" height="76" rx="8" fill="#181126" stroke="#9333EA" stroke-width="1" />
      <text x="12" y="22" class="card-title" fill="#D8B4FE" font-size="12">UU 远程 / 串流服务</text>
      <text x="12" y="40" class="card-body">在手机端显示器列表中</text>
      <text x="12" y="56" class="card-body">直接点选「Pocket Mac」虚拟屏</text>
      <text x="12" y="70" class="card-body">即刻进入 19.5:9 满屏竖屏</text>
    </g>

    <!-- iPhone Screen Presentation -->
    <g transform="translate(16, 142)">
      <rect width="208" height="242" rx="8" fill="#140D22" stroke="#C084FC" stroke-width="1" />
      <text x="12" y="24" class="card-title" fill="#F3E8FF" font-size="12">📱 iPhone 客户端体验</text>

      <!-- Mini Phone Mockup inside -->
      <g transform="translate(44, 38)">
        <!-- Outer bezel -->
        <rect width="120" height="186" rx="16" fill="#0A0612" stroke="#7E22CE" stroke-width="2" />
        <!-- Screen -->
        <rect x="5" y="5" width="110" height="176" rx="12" fill="#1E1B4B" />
        <!-- Dynamic Island -->
        <rect x="42" y="10" width="26" height="7" rx="3.5" fill="#000000" />
        <!-- Menu bar representation -->
        <rect x="9" y="21" width="102" height="6" rx="1" fill="#4338CA" />
        <!-- Vertical window 1 -->
        <rect x="9" y="31" width="102" height="68" rx="4" fill="#312E81" />
        <!-- Vertical window 2 -->
        <rect x="9" y="103" width="102" height="60" rx="4" fill="#1E293B" />
        <!-- Floating Exit Button on Screen -->
        <rect x="68" y="34" width="40" height="12" rx="3" fill="#DC2626" />
        <text x="88" y="42" fill="#FFFFFF" font-size="6" font-family="sans-serif" font-weight="bold" text-anchor="middle">退出模式</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrows -->
  <path d="M 280 200 L 320 200" stroke="#00F2FE" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 640 200 L 680 200" stroke="#C471ED" stroke-width="2" marker-end="url(#arrowPurple)" />
</svg>
